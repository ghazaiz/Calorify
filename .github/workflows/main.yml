name: Calorify CI/CD Pipeline

on:
  push: 
    branches: main  
  pull_request:
    branches: main

jobs:
  test:
    name: CI - Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: pytest -v

  staging:
    name: CD - Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Prepare Staging Environment
        run: echo "Preparing Calorify staging environment..."

      - name: Deploy to Staging (Demo)
        run: echo "Calorify staging deployment simulated successfully!"
   
  production:
    name: CD - Production
    runs-on: ubuntu-latest
    needs: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Production Environment
        run: echo "Preparing Calorify production environment..."

      - name: Deploy to Production (Demo)
        run: echo "Calorify production deployment simulated successfully!"

      - name: Verify Production Deployment
        run: echo "Calorify production deployment verified!"

{% extends "base.html" %}

{% block title %}Profile | Calorify{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card p-4">

            <!-- Heading -->
            <div class="mb-4">

                <h2>Create your profile</h2>

                <p class="text-muted">
                    Tell us a little about yourself so Calorify
                    can calculate your daily nutrition goals.
                </p>

            </div>


            <!-- Error Message -->
            {% if error %}

                <div class="alert alert-danger mb-4">
                    {{ error }}
                </div>

            {% endif %}


            <!-- Profile Form -->
            <form method="POST" action="/profile/">

                <!-- Age -->
                <div class="mb-3">

                    <label
                        for="age"
                        class="form-label">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        class="form-control"
                        min="1"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <!-- Sex -->
                <div class="mb-3">

                    <label
                        for="sex"
                        class="form-label">
                        Sex
                    </label>

                    <select
                        id="sex"
                        name="sex"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- Height -->
                <div class="mb-3">

                    <label
                        for="height_cm"
                        class="form-label">
                        Height (cm)
                    </label>

                    <input
                        type="number"
                        id="height_cm"
                        name="height_cm"
                        class="form-control"
                        step="0.1"
                        min="1"
                        placeholder="e.g. 170"
                        required
                    >

                </div>


                <!-- Weight -->
                <div class="mb-3">

                    <label
                        for="weight_kg"
                        class="form-label">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight_kg"
                        name="weight_kg"
                        class="form-control"
                        step="0.1"
                        min="1"
                        placeholder="e.g. 70"
                        required
                    >

                </div>


                <!-- Activity Level -->
                <div class="mb-3">

                    <label
                        for="activity_level"
                        class="form-label">
                        Activity level
                    </label>

                    <select
                        id="activity_level"
                        name="activity_level"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="sedentary">
                            Sedentary
                        </option>

                        <option value="light">
                            Lightly active
                        </option>

                        <option value="moderate">
                            Moderately active
                        </option>

                        <option value="active">
                            Very active
                        </option>

                    </select>

                </div>


                <!-- Goal -->
                <div class="mb-3">

                    <label
                        for="goal"
                        class="form-label">
                        Goal
                    </label>

                    <select
                        id="goal"
                        name="goal"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="lose">
                            Lose weight
                        </option>

                        <option value="maintain">
                            Maintain weight
                        </option>

                        <option value="gain">
                            Gain weight
                        </option>

                    </select>

                </div>


                <!-- Weekly Weight Loss -->
                <div
                    class="mb-4"
                    id="weightLossRate"
                >

                    <label
                        for="weekly_loss"
                        class="form-label">
                        How much weight do you want to lose per week?
                    </label>

                    <select
                        id="weekly_loss"
                        name="weekly_loss"
                        class="form-select"
                    >

                        <option value="0.5">
                            0.5 kg per week
                        </option>

                        <option value="1">
                            1 kg per week
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn-calorify w-100">
                    Create profile
                </button>

            </form>

        </div>

    </div>

</div>


<!-- Show/Hide Weekly Loss -->
<script>

const goalSelect = document.getElementById("goal");
const weightLossRate = document.getElementById("weightLossRate");

function updateWeightLossRate() {

    if (goalSelect.value === "lose") {

        weightLossRate.style.display = "block";

    } else {

        weightLossRate.style.display = "none";

    }

}

goalSelect.addEventListener(
    "change",
    updateWeightLossRate
);

updateWeightLossRate();

</script>

{% endblock %}

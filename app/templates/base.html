<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Calorify{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Calorify CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    {% block navigation %}
    <nav class="navbar navbar-expand-lg calorify-navbar">
        <div class="container">

            <a class="navbar-brand calorify-logo" href="{{ url_for('home') }}">
                Calorify
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('reports.dashboard') }}">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('meals.get_meals') }}">
                            Meals
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('reports.weekly_report') }}">
                            Progress
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('profile.profile') }}">
                            Profile
                        </a>
                    </li>

                    {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <form method="POST" action="/auth/logout" class="logout-form">
                            <button class="nav-link nav-button" type="submit">Log out</button>
                        </form>
                    </li>
                    {% else %}
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('authentication.login') }}">Log in</a></li>
                    <li class="nav-item"><a class="nav-link nav-guest-link" href="{{ url_for('nutrition.guest_search') }}">Guest mode</a></li>
                    {% endif %}

                </ul>

            </div>
        </div>
    </nav>
    {% endblock %}


    <!-- Main Content -->
    <main class="{% block main_class %}container py-4{% endblock %}">
        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>

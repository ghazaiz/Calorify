{% extends "base.html" %}

{% block title %}Login | Calorify{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card p-4 mt-5">

            <div class="text-center mb-4">
                <h2>Welcome back!</h2>
                <p class="text-muted">
                    Log in to continue tracking your nutrition.
                </p>
            </div>

            <form method="POST" action="/auth/login">

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-calorify w-100">
                    Log in
                </button>

            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a href="/auth/register" class="text-calorify">
                    Create one
                </a>
            </p>

        </div>

    </div>
</div>

{% endblock %}
